# موزیک پلیر اختصاصی گربول (Gorbool Music Player) - نسخه ریسپانسیو

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزیک پلیر اختصاصی گربول</title>
    <style>
        :root {
            --primary: #ff7675;
            --primary-light: #fab1a0;
            --secondary: #6c5ce7;
            --background: #f0f3f8;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * {

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ee5253 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        .player-wrapper {
            position: relative;

            width: 100%;
            max-width: 420px;
            margin: 20px auto;
            padding: 0 5px;
        }

        /* Cute Cat Ears for Gorbool Theme */
        .cat-ears {
            position: absolute;
            top: -22px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1;
            pointer-events: none;
        }


        .ear {
            width: 45px;
            height: 45px;
            background-color: var(--card-bg);
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            transform: rotate(-15deg);
            position: relative;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
        }

        .ear.right {
            transform: rotate(15deg);
        }

        .ear::after {
            content: '';
            position: absolute;
            top: 7px;

            left: 7px;
            width: 31px;
            height: 31px;
            background-color: var(--primary-light);
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        /* Main Container */
        .player-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 25px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;

            align-items: center;
            text-align: center;
            z-index: 2;
            position: relative;
            width: 100%;
        }

        .player-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .player-header h1 {
            font-size: 1.1rem;
            color: var(--text-main);

            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-dev {
            background: var(--secondary);
            color: #fff;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* Album Vinyl Disk Artwork - Fluid sizing */
        .disk-area {
            position: relative;

            width: 180px;
            height: 180px;
            margin-bottom: 20px;
            transition: width 0.3s, height 0.3s;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #2d3436;
            padding: 20%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateDisk 12s linear infinite;
            animation-play-state: paused;

        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 90%;
            height: 90%;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .vinyl-cover {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1e272e;
        }


        .center-hole {
            position: absolute;
            width: 18px;
            height: 18px;
            background: var(--background);
            border-radius: 50%;
            border: 3px solid #000;
            z-index: 5;
        }

        @keyframes rotateDisk {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Song Info */
        .track-info {
            margin-bottom: 20px;
            width: 100%;

        }

        .track-title {
            font-size: 1.25rem;
            color: var(--text-main);
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* Progress Bar / Timeline */
        .timeline-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 6px;
            background: #dfe6e9;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .progress-bar {
            position: absolute;
            top: 0;

            right: 0; /* RTL alignment */
            height: 100%;
            width: 0%;
            background: linear-gradient(to left, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Controls Layout */
        .controls-container {
            display: flex;
            justify-content: center;

            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .btn-control {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, color 0.2s;
            color: var(--text-main);
        }

        .btn-control:hover {
            transform: scale(1.1);

            color: var(--primary);
        }

        .btn-control:active {
            transform: scale(0.95);
        }

        .btn-play-pause {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            color: white;
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-play-pause:hover {
            color: white;
            transform: scale(1.05);

            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }

        /* Volume & Visualizer Section */
        .extra-controls {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.03);
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            gap: 12px;
        }

        .volume-box {
            display: flex;
            align-items: center;

            gap: 6px;
            flex: 1;
        }

        .volume-slider {
            width: 100%;
            accent-color: var(--secondary);
            cursor: pointer;
            height: 4px;
        }

        /* Animated Visualizer bars */
        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
            width: 55px;
            justify-content: center;

        }

        .v-bar {
            width: 4px;
            height: 4px;
            background-color: var(--primary);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        /* Playlist Section */
        .playlist-card {
            width: 100%;
            text-align: right;
            border-top: 1px solid rgba(0,0,0,0.06);
            padding-top: 15px;
        }

        .playlist-title {

            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tracks-list {
            max-height: 120px;
            overflow-y: auto;
            list-style: none;
            padding-right: 2px;
        }

        .tracks-list::-webkit-scrollbar {
            width: 4px;
        }

        .tracks-list::-webkit-scrollbar-thumb {
            background-color: #dfe6e9;
            border-radius: 4px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: background 0.2s;
            font-size: 0.85rem;
            color: var(--text-main);
        }

        .track-item:hover {

            background: rgba(0, 0, 0, 0.04);
        }

        .track-item.active {
            background: rgba(255, 118, 117, 0.12);
            color: var(--primary);
            font-weight: bold;
        }

        .track-item-left {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Responsive Breakpoint for Extra Small Mobile Screens (< 360px) */
        @media (max-width: 360px) {
            .player-container {
                padding: 15px;
                border-radius: 20px;

            }
            .disk-area {
                width: 140px;
                height: 140px;
            }
            .track-title {
                font-size: 1.1rem;
            }
            .controls-container {
                gap: 15px;
            }
            .btn-play-pause {
                width: 50px;
                height: 50px;
            }
            .cat-ears {
                padding: 0 30px;
                top: -20px;
            }

            .ear {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <!-- Cute Cat Layout Overlay -->
        <div class="cat-ears">
            <div class="ear left"></div>
            <div class="ear right"></div>
        </div>

        <div class="player-container">
            <!-- Header -->
            <div class="player-header">

                <span class="badge-dev">کدنویسی فرانت‌اند</span>
                <h1>پخش‌کننده موسیقی گربول 🐾</h1>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path><path d="M12 7v5l3 3"></path></svg>
            </div>

            <!-- Disk Art -->
            <div class="disk-area">
                <div class="vinyl" id="vinyl-disk">
                    <img id="album-art" src="https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="کاور آهنگ" class="vinyl-cover">
                    <div class="center-hole"></div>
                </div>
            </div>

            <!-- Track Meta Data -->
            <div class="track-info">
                <div class="track-title" id="display-title">آهنگ شجاعت گربول</div>
                <div class="track-artist" id="display-artist">آلبوم گربه فرانت‌اند پلیر</div>
            </div>


            <!-- Timeline Slider -->
            <div class="timeline-container">
                <div class="slider-wrapper" id="timeline-click-zone">
                    <div class="progress-bar" id="progress-indicator"></div>
                </div>
                <div class="time-stamps">
                    <span id="time-current">0:00</span>
                    <span id="time-max">0:30</span>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="controls-container">
                <!-- Next Button -->
                <button class="btn-control" id="btn-next" title="آهنگ بعدی">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18V6l8.5 6L6 18zm11-12h2v12h-2V6z"/></svg>
                </button>

                <!-- Play/Pause Button -->

                <button class="btn-control btn-play-pause" id="btn-main-trigger" title="پخش / توقف">
                    <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <!-- Previous Button -->
                <button class="btn-control" id="btn-prev" title="آهنگ قبلی">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 12L20 6v12l-8.5-6zm-8.5 6V6h2v12H3z"/></svg>
                </button>
            </div>

            <!-- Volume & Live Visualizer Simulation -->
            <div class="extra-controls">
                <div class="volume-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <input type="range" class="volume-slider" min="0" max="100" value="80" id="volume-control">
                </div>
                <div class="visualizer">
                    <div class="v-bar" style="height: 10px;"></div>

                    <div class="v-bar" style="height: 15px;"></div>
                    <div class="v-bar" style="height: 7px;"></div>
                    <div class="v-bar" style="height: 18px;"></div>
                    <div class="v-bar" style="height: 12px;"></div>
                </div>
            </div>

            <!-- Dynamic Interactive Playlist -->
            <div class="playlist-card">
                <div class="playlist-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span>لیست آهنگ‌های گربول شجاع</span>
                </div>
                <ul class="tracks-list" id="playlist-element">
                    <!-- Dynamic Items inject here -->
                </ul>
            </div>
        </div>
    </div>


    <script>
        const trackData = [
            {
                title: "کدنویسی نیمه‌شب گربول",
                artist: "آلبوم گربه شجاع دانشگاه",
                duration: "0:30",
                cover: "https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                frequency: 290
            },
            {
                title: "تصمیم بزرگ فرانت‌اند",
                artist: "گربول مَمل نسخه ۳",
                duration: "0:45",
                cover: "https://images.unsplash.com/photo-1561948955-570b270e7c36?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                frequency: 440
            },
            {
                title: "موسیقی آرامش فرکانس گربه‌ای",
                artist: "امیر رضا کلهر ریمیکس",

                duration: "1:00",
                cover: "https://images.unsplash.com/photo-1529778873920-4da4926a72c2?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                frequency: 330
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentTime = 0;
        let timerInterval = null;
        let visualizerInterval = null;

        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        const vinylDisk = document.getElementById('vinyl-disk');
        const albumArt = document.getElementById('album-art');
        const displayTitle = document.getElementById('display-title');

        const displayArtist = document.getElementById('display-artist');
        const progressIndicator = document.getElementById('progress-indicator');
        const timeCurrent = document.getElementById('time-current');
        const timeMax = document.getElementById('time-max');
        const btnMainTrigger = document.getElementById('btn-main-trigger');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const playlistElement = document.getElementById('playlist-element');
        const timelineClickZone = document.getElementById('timeline-click-zone');
        const volumeControl = document.getElementById('volume-control');
        const visualizerBars = document.querySelectorAll('.v-bar');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function startSynthMusic(freq) {

            initAudio();
            if (oscillator) stopSynthMusic();

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            const vol = volumeControl.value / 100;
            gainNode.gain.setValueAtTime(vol * 0.15, audioCtx.currentTime);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopSynthMusic() {
            if (oscillator) {

                try {
                    oscillator.stop();
                    oscillator.disconnect();
                } catch(e) {}
                oscillator = null;
            }
        }

        function formatSeconds(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function parseDuration(durationStr) {
            const parts = durationStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }


        function renderPlaylist() {
            playlistElement.innerHTML = '';
            trackData.forEach((track, idx) => {
                const li = document.createElement('li');
                li.className = `track-item ${idx === currentTrackIndex ? 'active' : ''}`;
                li.innerHTML = `
                    <div>${track.title}</div>
                    <div class="track-item-left">${track.duration}</div>
                `;
                li.addEventListener('click', () => {
                    selectTrack(idx);
                });
                playlistElement.appendChild(li);
            });
        }

        function selectTrack(idx) {
            currentTrackIndex = idx;
            currentTime = 0;

            const track = trackData[currentTrackIndex];
            
            displayTitle.textContent = track.title;
            displayArtist.textContent = track.artist;
            albumArt.src = track.cover;
            timeMax.textContent = track.duration;
            progressIndicator.style.width = '0%';
            timeCurrent.textContent = '0:00';

            renderPlaylist();

            if (isPlaying) {
                startSynthMusic(track.frequency);
            }
        }

        function togglePlayPause() {
            initAudio();
            const currentTrack = trackData[currentTrackIndex];

            
            if (isPlaying) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                vinylDisk.style.animationPlayState = 'paused';
                clearInterval(timerInterval);
                clearInterval(visualizerInterval);
                stopSynthMusic();
                resetVisualizer();
            } else {
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                vinylDisk.style.animationPlayState = 'running';
                
                startSynthMusic(currentTrack.frequency);
                
                const maxSeconds = parseDuration(currentTrack.duration);

                timerInterval = setInterval(() => {
                    currentTime += 1;
                    if (currentTime > maxSeconds) {
                        currentTime = 0;
                        nextTrack();
                        return;
                    }
                    timeCurrent.textContent = formatSeconds(currentTime);
                    const percent = (currentTime / maxSeconds) * 100;
                    progressIndicator.style.width = `${percent}%`;
                }, 1000);

                visualizerInterval = setInterval(() => {
                    visualizerBars.forEach(bar => {
                        const randomHeight = Math.floor(Math.random() * 18) + 4;
                        bar.style.height = `${randomHeight}px`;
                    });
                }, 150);
            }

        }

        function nextTrack() {
            let nextIdx = currentTrackIndex + 1;
            if (nextIdx >= trackData.length) nextIdx = 0;
            selectTrack(nextIdx);
        }

        function prevTrack() {
            let prevIdx = currentTrackIndex - 1;
            if (prevIdx < 0) prevIdx = trackData.length - 1;
            selectTrack(prevIdx);
        }

        function resetVisualizer() {
            visualizerBars.forEach(bar => bar.style.height = '4px');
        }

        timelineClickZone.addEventListener('click', (e) => {

            const rect = timelineClickZone.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            
            let percentage = (width - clickX) / width;
            if (document.documentElement.dir !== 'rtl') {
                percentage = clickX / width;
            }
            
            const currentTrack = trackData[currentTrackIndex];
            const maxSeconds = parseDuration(currentTrack.duration);
            
            currentTime = Math.floor(percentage * maxSeconds);
            if(currentTime < 0) currentTime = 0;
            if(currentTime > maxSeconds) currentTime = maxSeconds;

            timeCurrent.textContent = formatSeconds(currentTime);
            progressIndicator.style.width = `${percentage * 100}%`;
        });


        volumeControl.addEventListener('input', () => {
            if (gainNode && audioCtx) {
                const vol = volumeControl.value / 100;
                gainNode.gain.setValueAtTime(vol * 0.15, audioCtx.currentTime);
            }
        });

        btnMainTrigger.addEventListener('click', togglePlayPause);
        document.getElementById('btn-next').addEventListener('click', nextTrack);
        document.getElementById('btn-prev').addEventListener('click', prevTrack);

        let touchStartX = 0;
        vinylDisk.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, {passive: true});

        vinylDisk.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            if (touchStartX - touchEndX > 50) {

                nextTrack();
            } else if (touchEndX - touchStartX > 50) {
                prevTrack();
            }
        }, {passive: true});

        selectTrack(0);
    </script>
</body>
</html>
