# موزیک پلیر پیشرفته و کیوت گربول پرو (Gorbool Cute Studio)

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موزیک پلیر پیشرفته و کیوت گربول پرو</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ff7675 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(255, 118, 117, 0.2);
            --text-main: #2d3436;
            --text-sub: #636e72;
            --primary: #ff7675;
            --primary-light: #fab1a0;
            --secondary: #6c5ce7;
            --secondary-light: #a855f7;
            --glass-shadow: 0 15px 35px rgba(255, 118, 117, 0.2);
            --active-item: rgba(255, 118, 117, 0.15);

        }

        .dark-neon-theme {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #2e1065 50%, #4c1d95 100%);
            --card-bg: rgba(30, 27, 75, 0.85);
            --border-color: rgba(168, 85, 247, 0.3);
            --text-main: #f8fafc;
            --text-sub: #c084fc;
            --primary: #a855f7;
            --primary-light: #c084fc;
            --secondary: #f43f5e;
            --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            --active-item: rgba(168, 85, 247, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* Master Dashboard Wrapper with Cat Theme */
        .dashboard-wrapper {
            position: relative;

            width: 100%;
            max-width: 900px;
            margin-top: 25px;
        }

        /* Cute Studio Cat Ears Layout */
        .cat-ears-studio {
            position: absolute;
            top: -26px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            z-index: 1;
            pointer-events: none;
        }

        .studio-ear {

            width: 60px;
            height: 60px;
            background-color: var(--card-bg);
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            transform: rotate(-12deg);
            position: relative;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }

        .studio-ear.right {
            transform: rotate(12deg);
        }

        .studio-ear::after {
            content: '';

            position: absolute;
            top: 10px;
            left: 10px;
            width: 38px;
            height: 38px;
            background-color: var(--primary-light);
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            transition: background-color 0.3s;
        }

        .dashboard-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            box-shadow: var(--glass-shadow);
            padding: 30px;

            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
            position: relative;
            z-index: 2;
            transition: background 0.3s, box-shadow 0.3s, border 0.3s;
        }

        /* Top Control Bar */
        .top-bar {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .brand-section {

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to left, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .util-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .eq-preset-select {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
        }

        .btn-util {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 12px;

            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }
        .btn-util:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* RIGHT PANEL: Cute Vinyl Disk & Main Deck Controls */
        .deck-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);

            padding-right: 20px;
        }

        .disk-deck {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 15px 0;
        }

        .vinyl-pro {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #353b48 0%, #2f3640 100%);
            padding: 42px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.25), inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;

            align-items: center;
            position: relative;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-cover {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #111827;
        }

        .tonearm {
            position: absolute;
            top: -10px;
            left: 20px;
            width: 55px;

            height: 95px;
            transform-origin: top right;
            transform: rotate(-25deg);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 4;
        }
        .tonearm.active {
            transform: rotate(2deg);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .meta-container {
            width: 100%;
            text-align: center;
            margin-bottom: 15px;

        }

        .meta-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .meta-artist {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* Timeline Slider Track */
        .timeline-pro {
            width: 100%;
            margin-bottom: 15px;
        }


        .track-scrub {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.08);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .track-progress {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(to left, var(--primary), var(--secondary));
            border-radius: 10px;
        }


        /* Core Actions Controls */
        .action-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .btn-action:hover {
            color: var(--primary);
            transform: scale(1.15);
        }

        .btn-action.toggle-main {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-radius: 50%;
            box-shadow: var(--glass-shadow);
        }
        .btn-action.toggle-main:hover {
            transform: scale(1.05);
        }
        .btn-action.active-state {
            color: var(--secondary);

            font-weight: bold;
        }

        /* Volume Deck Component */
        .volume-deck {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .slider-input {
            width: 100%;
            accent-color: var(--primary);
            height: 4px;

            cursor: pointer;
        }

        /* LEFT PANEL: Equalizer, Lyrics & Playlist */
        .features-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 460px;
            overflow-y: auto;
            padding-left: 4px;
        }

        /* Studio Cute Equalizer Panel */
        .studio-eq {
            background: rgba(0,0,0,0.02);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid var(--border-color);

        }

        .eq-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        .eq-sliders-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 85px;
        }


        .eq-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
        }

        .eq-slider-vertical {
            transform: rotate(-90deg);
            width: 55px;
            height: 4px;
            margin: 20px 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .eq-label {
            font-size: 0.7rem;

            color: var(--text-sub);
            font-weight: bold;
        }

        /* Synced Lyrics Module */
        .lyrics-box {
            background: rgba(255, 118, 117, 0.04);
            border-radius: 20px;
            padding: 12px;
            height: 110px;
            overflow-y: auto;
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            scroll-behavior: smooth;
        }

        .lyrics-line {
            font-size: 0.9rem;

            padding: 5px 0;
            color: var(--text-sub);
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .lyrics-line.highlight {
            color: var(--secondary);
            font-weight: bold;
            transform: scale(1.03);
            opacity: 1;
        }

        /* Live Studio Visualizer Grid */
        .studio-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;

            height: 35px;
            width: 100%;
            padding: 0 5px;
        }
        .sv-bar {
            flex: 1;
            height: 4px;
            background: linear-gradient(to top, var(--primary), var(--secondary));
            border-radius: 3px 3px 0 0;
            transition: height 0.1s ease;
        }

        /* Playlist Section */
        .playlist-wrapper {
            background: rgba(0,0,0,0.01);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid var(--border-color);
        }


        .playlist-hdr-text {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pro-track-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pro-track-item {
            display: flex;
            align-items: center;

            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        .pro-track-item:hover {
            background: rgba(0,0,0,0.03);
            transform: translateX(-2px);
        }
        .pro-track-item.active {
            background: var(--active-item);
            border-color: var(--border-color);
            color: var(--secondary);
            font-weight: 700;
        }


        .flex-meta-side {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Responsive Architecture */
        @media (max-width: 800px) {
            .dashboard-container {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }
            .deck-panel {
                border-right: none;
                padding-right: 0;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 20px;
            }

            .features-panel {
                max-height: none;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .dashboard-container { padding: 15px; border-radius: 24px; }
            .disk-deck { width: 160px; height: 160px; }
            .meta-title { font-size: 1.1rem; }
            .cat-ears-studio { padding: 0 35px; top: -22px; }
            .studio-ear { width: 48px; height: 48px; }
            .studio-ear::after { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">

        <!-- Cute Studio Cat Ears Overlay -->
        <div class="cat-ears-studio">
            <div class="studio-ear left"></div>
            <div class="studio-ear right"></div>
        </div>

        <div class="dashboard-container">
            <!-- TOP CONTROL BAR -->
            <div class="top-bar">
                <div class="brand-section">
                    <span style="font-size: 1.3rem;">🐾</span>
                    <span class="brand-title">استودیو موزیک گربول شجاع پرو</span>
                </div>
                <div class="util-buttons">
                    <!-- Speed Control Selector -->
                    <select id="playback-speed" class="eq-preset-select" title="سرعت پخش">
                        <option value="0.5">0.5x (آرام)</option>
                        <option value="1.0" selected>1.0x (طبیعی)</option>
                        <option value="1.5">1.5x (سریع)</option>

                        <option value="2.0">2.0x (سرعت گربول)</option>
                    </select>
                    <!-- Light/Dark Toggle -->
                    <button class="btn-util" id="theme-toggler" title="تغییر حالت نئونی">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- LEFT PANEL: Lyrics, Equalizer & Playlist -->
            <div class="features-panel">
                
                <!-- Working Audio Equalizer Dashboard -->
                <div class="studio-eq">
                    <div class="eq-header">
                        <span>تنظیمات فرکانس و اکولایزر گربولی</span>
                        <select id="eq-preset" class="eq-preset-select">
                            <option value="flat">حالت استاندارد (Flat)</option>
                            <option value="bassboost">مِیو باس (Bass Boost)</option>

                            <option value="vocal">وضوح صدای خواننده</option>
                            <option value="electronic">سایبر گربول الکترو</option>
                        </select>
                    </div>
                    <div class="eq-sliders-row">
                        <div class="eq-col">
                            <input type="range" class="eq-slider-vertical" id="eq-bass" min="-10" max="10" value="0">
                            <span class="eq-label">BASS</span>
                        </div>
                        <div class="eq-col">
                            <input type="range" class="eq-slider-vertical" id="eq-mid" min="-10" max="10" value="0">
                            <span class="eq-label">MID</span>
                        </div>
                        <div class="eq-col">
                            <input type="range" class="eq-slider-vertical" id="eq-treble" min="-10" max="10" value="0">
                            <span class="eq-label">TREBLE</span>
                        </div>
                    </div>
                </div>


                <!-- Synchronized Intelligent Lyrics Box -->
                <div class="lyrics-box" id="lyrics-scroller">
                    <div class="lyrics-line">شروع پخش موزیک گربول شجاع...</div>
                </div>

                <!-- Studio Frequency Visualizer Graphic -->
                <div class="studio-visualizer" id="visualizer-grid">
                    <!-- Bars injected here -->
                </div>

                <!-- Advanced Playlist Tracker Grid -->
                <div class="playlist-wrapper">
                    <div class="playlist-hdr-text">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
                        <span>قطعات آلبوم گربول فرانت‌اند پلیر</span>
                    </div>
                    <ul class="pro-track-list" id="pro-playlist">
                        <!-- Dynamic items -->
                    </ul>

                </div>
            </div>

            <!-- RIGHT PANEL: Vinyl Disk Layout & Deck Actions -->
            <div class="deck-panel">
                <!-- Turntable Disk -->
                <div class="disk-deck">
                    <img src="https://images.gstatic.com/images?q=tbn:ANd9GcR6A7L5760t0A03V_g7wWj3-kRkS81v_mE2vA&s" class="tonearm" id="turntable-arm" alt="Tonearm">
                    <div class="vinyl-pro" id="vinyl-element">
                        <img src="https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" class="vinyl-cover" id="deck-cover" alt="Cover">
                    </div>
                </div>

                <!-- Core Metadata Info Track -->
                <div class="meta-container">
                    <div class="meta-title" id="deck-title">بارگذاری قطعه...</div>
                    <div class="meta-artist" id="deck-artist">آلبوم دانشگاه گربول</div>
                </div>


                <!-- Pro Timeline Controller -->
                <div class="timeline-pro">
                    <div class="track-scrub" id="timeline-bar">
                        <div class="track-progress" id="timeline-fill"></div>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-sub);">
                        <span id="lbl-time-current">00:00</span>
                        <span id="lbl-time-max">00:00</span>
                    </div>
                </div>

                <!-- Action Control Buttons Deck Layout -->
                <div class="action-controls">
                    <!-- Shuffle Toggle -->
                    <button class="btn-action" id="btn-shuffle" title="پخش تصادفی">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline></svg>
                    </button>

                    <!-- Previous Track -->

                    <button class="btn-action" id="btn-prev-track" title="قطعه قبلی">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 12L20 6v12l-8.5-6zm-8.5 6V6h2v12H3z"/></svg>
                    </button>

                    <!-- Big Main Play/Pause Trigger -->
                    <button class="btn-action toggle-main" id="btn-master-play" title="پخش و توقف">
                        <svg id="svg-play-ico" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="svg-pause-ico" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>

                    <!-- Next Track -->
                    <button class="btn-action" id="btn-next-track" title="قطعه بعدی">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18V6l8.5 6L6 18zm11-12h2v12h-2V6z"/></svg>
                    </button>

                    <!-- Repeat Loop Trigger -->
                    <button class="btn-action" id="btn-repeat" title="تکرار">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path></svg>
                    </button>

                </div>

                <!-- Volume Slider Area -->
                <div class="volume-deck">
                    <button class="btn-action" id="btn-mute-toggle" style="color: var(--text-sub);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
                    </button>
                    <input type="range" class="slider-input" min="0" max="100" value="75" id="slider-volume">
                    <!-- Like System Button -->
                    <button class="btn-action" id="btn-like-heart" title="علاقه‌مندی" style="margin-right: auto; color: var(--text-sub);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 21.9 5.42 21.9 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const premiumTracks = [

            {
                title: "کدنویسی نیمه‌شب گربول شجاع",
                artist: "آلبوم مهندسی فرانت‌اند دانشگاه",
                duration: 35,
                cover: "https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                baseFreq: 260,
                lyrics: {
                    0: "🐾 نیمه شبه و گربول بیداره پای کد...",
                    8: "💻 باگ‌ها می‌ترسن وقتی اونا رو می‌کنه متد!",
                    16: "🚀 رنک بالای دانشگاه با اراده‌ای شجاع",
                    25: "✨ آینده مال گربوله، توی دنیای فرانت‌اند..."
                }
            },
            {
                title: "تصمیم بزرگ لوپ فرانت‌اند",
                artist: "گربول مَمل نسخه پرو",
                duration: 40,
                cover: "https://images.unsplash.com/photo-1561948955-570b270e7c36?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                baseFreq: 340,

                lyrics: {
                    0: "🎵 تصمیم بزرگ گربول برای تغییر پوسته وب...",
                    10: "⚡ ری‌اکت و کامپوننت‌ها دارن رندر میشن امشب",
                    22: "🧠 هیچ کی نمی‌تونه جلوشو بگیره توی این لوپ",
                    32: "🌟 گربول پرو رو بشناس، گربه فرانت‌اند شجاع!"
                }
            },
            {
                title: "فرکانس آرامش بخش مِندِل",
                artist: "امیر رضا کلهر ریمیکس استودیو",
                duration: 45,
                cover: "https://images.unsplash.com/photo-1529778873920-4da4926a72c2?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D",
                baseFreq: 420,
                lyrics: {
                    0: "🍃 فرکانس‌های آرامش بخش برای تمرکز عمیق...",
                    12: "🎹 استودیوی شخصی گربول و ریتم‌های ملودیک شیک",
                    25: "🌌 گربول شجاع قصه ما، حالا یک مهندس کامله",
                    36: "🏆 پیروزی فرانت‌اند در تاریکی شب حاصله."
                }

            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let currentTime = 0;
        let isMuted = false;
        let isShuffle = false;
        let isRepeat = false;
        let trackLikes = [false, false, false];

        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;
        let bassFilter = null;
        let midFilter = null;
        let trebleFilter = null;

        let playTimer = null;

        let visualizerTimer = null;

        const vinylElement = document.getElementById('vinyl-element');
        const turntableArm = document.getElementById('turntable-arm');
        const deckCover = document.getElementById('deck-cover');
        const deckTitle = document.getElementById('deck-title');
        const deckArtist = document.getElementById('deck-artist');
        const timelineFill = document.getElementById('timeline-fill');
        const lblTimeCurrent = document.getElementById('lbl-time-current');
        const lblTimeMax = document.getElementById('lbl-time-max');
        const timelineBar = document.getElementById('timeline-bar');

        const btnMasterPlay = document.getElementById('btn-master-play');
        const svgPlayIco = document.getElementById('svg-play-ico');
        const svgPauseIco = document.getElementById('svg-pause-ico');
        const sliderVolume = document.getElementById('slider-volume');
        const btnLikeHeart = document.getElementById('btn-like-heart');

        const btnShuffle = document.getElementById('btn-shuffle');

        const btnRepeat = document.getElementById('btn-repeat');
        const playbackSpeed = document.getElementById('playback-speed');
        const themeToggler = document.getElementById('theme-toggler');
        const eqPreset = document.getElementById('eq-preset');

        const lyricsScroller = document.getElementById('lyrics-scroller');
        const visualizerGrid = document.getElementById('visualizer-grid');
        const proPlaylist = document.getElementById('pro-playlist');

        function generateVisualizerBars() {
            visualizerGrid.innerHTML = '';
            for(let i=0; i<26; i++) {
                const bar = document.createElement('div');
                bar.className = 'sv-bar';
                visualizerGrid.appendChild(bar);
            }
        }

        function initStudioAudio() {

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowshelf';
                bassFilter.frequency.setValueAtTime(200, audioCtx.currentTime);

                midFilter = audioCtx.createBiquadFilter();
                midFilter.type = 'peaking';
                midFilter.Q.setValueAtTime(1.0, audioCtx.currentTime);
                midFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);

                trebleFilter = audioCtx.createBiquadFilter();
                trebleFilter.type = 'highshelf';
                trebleFilter.frequency.setValueAtTime(3000, audioCtx.currentTime);

                gainNode = audioCtx.createGain();
                updateVolumeGain();
            }

        }

        function updateVolumeGain() {
            if (gainNode && audioCtx) {
                const targetVol = isMuted ? 0 : (sliderVolume.value / 100);
                gainNode.gain.setValueAtTime(targetVol * 0.15, audioCtx.currentTime);
            }
        }

        function startOscillatorTone(freq) {
            initStudioAudio();
            if (oscillator) stopOscillatorTone();

            oscillator = audioCtx.createOscillator();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(freq * parseFloat(playbackSpeed.value), audioCtx.currentTime);

            oscillator.connect(bassFilter);
            bassFilter.connect(midFilter);

            midFilter.connect(trebleFilter);
            trebleFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
        }

        function stopOscillatorTone() {
            if (oscillator) {
                try {
                    oscillator.stop();
                    oscillator.disconnect();
                } catch(e) {}
                oscillator = null;
            }
        }

        function formatDigitTime(sec) {
            const m = Math.floor(sec / 60);

            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updatePlaylistView() {
            proPlaylist.innerHTML = '';
            premiumTracks.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = `pro-track-item ${i === currentIndex ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="flex-meta-side">
                        <span style="opacity: 0.6;">🐾 0${i+1}</span>
                        <div>${t.title}</div>
                    </div>
                    <div style="font-size: 0.75rem; opacity: 0.7;">${formatDigitTime(t.duration)}</div>
                `;
                li.addEventListener('click', () => { selectTrackByIndex(i); });
                proPlaylist.appendChild(li);
            });

        }

        function selectTrackByIndex(index) {
            currentIndex = index;
            currentTime = 0;
            const track = premiumTracks[currentIndex];

            deckTitle.textContent = track.title;
            deckArtist.textContent = track.artist;
            deckCover.src = track.cover;
            lblTimeMax.textContent = formatDigitTime(track.duration);
            lblTimeCurrent.textContent = "00:00";
            timelineFill.style.width = "0%";

            btnLikeHeart.style.color = trackLikes[currentIndex] ? 'var(--secondary)' : 'var(--text-sub)';

            updatePlaylistView();
            renderLyricsLayout();


            if (isPlaying) {
                startOscillatorTone(track.baseFreq);
            }
        }

        function renderLyricsLayout() {
            lyricsScroller.innerHTML = '';
            const track = premiumTracks[currentIndex];
            Object.keys(track.lyrics).forEach(timeKey => {
                const p = document.createElement('div');
                p.className = 'lyrics-line';
                p.id = `lyric-line-${timeKey}`;
                p.textContent = track.lyrics[timeKey];
                lyricsScroller.appendChild(p);
            });
            syncLyricsHighlight();
        }

        function syncLyricsHighlight() {

            const track = premiumTracks[currentIndex];
            let activeKey = null;
            
            Object.keys(track.lyrics).forEach(timeKey => {
                if (currentTime >= parseInt(timeKey)) {
                    activeKey = timeKey;
                }
            });

            if (activeKey !== null) {
                const lines = lyricsScroller.querySelectorAll('.lyrics-line');
                lines.forEach(l => l.classList.remove('highlight'));
                
                const targetLine = document.getElementById(`lyric-line-${activeKey}`);
                if (targetLine) {
                    targetLine.classList.add('highlight');
                    lyricsScroller.scrollTop = targetLine.offsetTop - 35;
                }
            }

        }

        function handlePlayToggle() {
            initStudioAudio();
            const track = premiumTracks[currentIndex];

            if (isPlaying) {
                isPlaying = false;
                svgPlayIco.style.display = 'block';
                svgPauseIco.style.display = 'none';
                vinylElement.style.animationPlayState = 'paused';
                turntableArm.classList.remove('active');
                
                stopOscillatorTone();
                clearInterval(playTimer);
                clearInterval(visualizerTimer);
                resetVisualizerNodes();
            } else {
                isPlaying = true;

                svgPlayIco.style.display = 'none';
                svgPauseIco.style.display = 'block';
                vinylElement.style.animationPlayState = 'running';
                turntableArm.classList.add('active');

                startOscillatorTone(track.baseFreq);

                playTimer = setInterval(() => {
                    currentTime += 1 * parseFloat(playbackSpeed.value);
                    if (currentTime >= track.duration) {
                        handleTrackFinishedEnding();
                        return;
                    }
                    lblTimeCurrent.textContent = formatDigitTime(currentTime);
                    timelineFill.style.width = `${(currentTime / track.duration) * 100}%`;
                    syncLyricsHighlight();
                }, 1000);

                const bars = document.querySelectorAll('.sv-bar');

                visualizerTimer = setInterval(() => {
                    bars.forEach((bar, idx) => {
                        let dynamicFactor = Math.sin(idx + currentTime) * 8 + 12;
                        let randomHeight = Math.floor(Math.random() * dynamicFactor) + 3;
                        bar.style.height = `${Math.min(randomHeight, 35)}px`;
                    });
                }, 100);
            }
        }

        function handleTrackFinishedEnding() {
            if (isRepeat) {
                selectTrackByIndex(currentIndex);
            } else if (isShuffle) {
                let randomIdx = Math.floor(Math.random() * premiumTracks.length);
                selectTrackByIndex(randomIdx);
            } else {
                let nextIdx = currentIndex + 1;
                if (nextIdx >= premiumTracks.length) nextIdx = 0;

                selectTrackByIndex(nextIdx);
            }
            if(!isPlaying) handlePlayToggle();
        }

        function resetVisualizerNodes() {
            document.querySelectorAll('.sv-bar').forEach(b => b.style.height = '4px');
        }

        function bindEqualizerSliders() {
            const bassInp = document.getElementById('eq-bass');
            const midInp = document.getElementById('eq-mid');
            const trebleInp = document.getElementById('eq-treble');

            bassInp.addEventListener('input', () => {
                if (bassFilter) bassFilter.gain.setValueAtTime(bassInp.value, audioCtx.currentTime);
            });
            midInp.addEventListener('input', () => {
                if (midFilter) midFilter.gain.setValueAtTime(midInp.value, audioCtx.currentTime);

            });
            trebleInp.addEventListener('input', () => {
                if (trebleFilter) trebleFilter.gain.setValueAtTime(trebleInp.value, audioCtx.currentTime);
            });
        }

        eqPreset.addEventListener('change', () => {
            const val = eqPreset.value;
            const b = document.getElementById('eq-bass');
            const m = document.getElementById('eq-mid');
            const t = document.getElementById('eq-treble');

            if(val === 'bassboost') { b.value = 8; m.value = 1; t.value = -2; }
            else if(val === 'vocal') { b.value = -3; m.value = 6; t.value = 4; }
            else if(val === 'electronic') { b.value = 6; m.value = -1; t.value = 7; }
            else { b.value = 0; m.value = 0; t.value = 0; }

            if (audioCtx) {
                bassFilter.gain.setValueAtTime(b.value, audioCtx.currentTime);

                midFilter.gain.setValueAtTime(m.value, audioCtx.currentTime);
                trebleFilter.gain.setValueAtTime(t.value, audioCtx.currentTime);
            }
        });

        timelineBar.addEventListener('click', (e) => {
            const rect = timelineBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const totalWidth = rect.width;
            
            let percentage = (totalWidth - clickX) / totalWidth;
            if (document.documentElement.dir !== 'rtl') percentage = clickX / totalWidth;

            const currentTrack = premiumTracks[currentIndex];
            currentTime = Math.floor(percentage * currentTrack.duration);
            
            lblTimeCurrent.textContent = formatDigitTime(currentTime);
            timelineFill.style.width = `${percentage * 100}%`;
            syncLyricsHighlight();

        });

        btnMasterPlay.addEventListener('click', handlePlayToggle);
        document.getElementById('btn-next-track').addEventListener('click', () => {
            let next = currentIndex + 1; if(next >= premiumTracks.length) next = 0; selectTrackByIndex(next);
        });
        document.getElementById('btn-prev-track').addEventListener('click', () => {
            let prev = currentIndex - 1; if(prev < 0) prev = premiumTracks.length - 1; selectTrackByIndex(prev);
        });

        btnShuffle.addEventListener('click', () => {
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('active-state', isShuffle);
        });
        btnRepeat.addEventListener('click', () => {
            isRepeat = !isRepeat;
            btnRepeat.classList.toggle('active-state', isRepeat);
        });


        btnLikeHeart.addEventListener('click', () => {
            trackLikes[currentIndex] = !trackLikes[currentIndex];
            btnLikeHeart.style.color = trackLikes[currentIndex] ? 'var(--secondary)' : 'var(--text-sub)';
        });

        sliderVolume.addEventListener('input', updateVolumeGain);
        document.getElementById('btn-mute-toggle').addEventListener('click', () => {
            isMuted = !isMuted;
            document.getElementById('btn-mute-toggle').style.color = isMuted ? 'var(--secondary)' : 'var(--text-sub)';
            updateVolumeGain();
        });

        playbackSpeed.addEventListener('change', () => {
            if (isPlaying) {
                const track = premiumTracks[currentIndex];
                startOscillatorTone(track.baseFreq);
            }
        });


        themeToggler.addEventListener('click', () => {
            document.body.classList.toggle('dark-neon-theme');
        });

        generateVisualizerBars();
        selectTrackByIndex(0);
        bindEqualizerSliders();
    </script>
</body>
</html>
