<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دزفول ❤️</title>
    <style>
        :root {
            --bg1: #0f172a;
            --bg2: #1e293b;
            --card: rgba(15, 23, 42, 0.72);
            --card-strong: rgba(15, 23, 42, 0.88);
            --primary: #8b5cf6;
            --primary-2: #ec4899;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --muted: #cbd5e1;
            --soft: #94a3b8;
            --input: rgba(148, 163, 184, 0.08);
            --glow: rgba(139, 92, 246, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: "Tahoma", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(168, 85, 247, 0.25), transparent 25%),
                radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.18), transparent 25%),
                linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            color: var(--text);
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            filter: blur(72px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            background: rgba(236, 72, 153, 0.35);
            top: -100px;
            right: -60px;
        }

        body::after {
            background: rgba(59, 130, 246, 0.35);
            bottom: -100px;
            left: -80px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 560px);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.7));
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 28px;
            padding: 28px 28px 22px;
            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow:
                0 30px 80px rgba(139, 92, 246, 0.18),
                0 20px 60px rgba(15, 23, 42, 0.6);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(12px);
            opacity: 0.8;
        }

        .orb.one {
            width: 120px;
            height: 120px;
            top: 10px;
            left: 24px;
            background: rgba(59, 130, 246, 0.2);
        }

        .orb.two {
            width: 100px;
            height: 100px;
            bottom: 18px;
            right: 30px;
            background: rgba(236, 72, 153, 0.18);
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .step-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.3);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            transform: scale(1.3);
            box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
        }

        .step-dot.completed {
            background: linear-gradient(135deg, #34d399, #22c55e);
        }

        .header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 18px;
        }

        .emoji-big {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 82px;
            height: 82px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.22), rgba(236, 72, 153, 0.18));
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 42px;
            margin-bottom: 16px;
            box-shadow: 0 18px 35px rgba(139, 92, 246, 0.18);
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            color: var(--text);
            font-weight: 800;
            letter-spacing: 0.2px;
            line-height: 1.4;
        }

        .input-group {
            margin-top: 20px;
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: rgba(148, 163, 184, 0.06);
            color: var(--text);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        input[type="text"]::placeholder {
            color: rgba(203, 213, 225, 0.7);
        }

        input[type="text"]:focus {
            border-color: rgba(168, 85, 247, 0.7);
            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.12),
                inset 0 0 0 1px rgba(255,255,255,0.04);
            background: rgba(148, 163, 184, 0.08);
        }

        .btn-primary {
            width: 100%;
            border: none;
            outline: none;
            padding: 15px 20px;
            border-radius: 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
            box-shadow: 0 14px 32px rgba(139, 92, 246, 0.35);
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(236, 72, 153, 0.26);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-nav {
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-prev {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            box-shadow: 0 12px 26px rgba(245, 158, 11, 0.24);
        }

        .btn-next {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 12px 26px rgba(34, 197, 94, 0.24);
        }

        .btn-nav:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            margin-top: 22px;
            min-height: 86px;
            border-radius: 18px;
            background: rgba(148, 163, 184, 0.05);
            border: 1px dashed rgba(148, 163, 184, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 16px 14px;
            overflow: hidden;
            transition: all 0.35s ease;
        }

        .result-container.show {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(236, 72, 153, 0.24));
            border-color: rgba(236, 72, 153, 0.32);
            box-shadow: 0 12px 30px rgba(139, 92, 246, 0.18);
        }

        .result-container.show-green {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.24), rgba(16, 185, 129, 0.2));
            border-color: rgba(34, 197, 94, 0.36);
            box-shadow: 0 12px 30px rgba(34, 197, 94, 0.2);
        }

        .result-container.show-red {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(236, 72, 153, 0.2));
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.18);
        }

        .result-container.show-orange {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(249, 115, 22, 0.18));
            border-color: rgba(245, 158, 11, 0.32);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.14);
        }

        .result-text {
            color: var(--muted);
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 1;
            transition: all 0.35s ease;
        }

        .result-text.show {
            color: white;
            transform: scale(1.02);
        }

        .name-highlight {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.08);
            font-weight: 800;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.92);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-container.show,
        .result-container.show-green,
        .result-container.show-red,
        .result-container.show-orange {
            animation: popIn 0.35s ease;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px 18px 18px;
                border-radius: 22px;
            }

            .nav-buttons {
                grid-template-columns: 1fr;
            }

            .emoji-big {
                width: 72px;
                height: 72px;
                font-size: 34px;
            }

            .result-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="orb one"></div>
        <div class="orb two"></div>

        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>

        <div class="header-box">
            <span class="emoji-big" id="emojiDisplay">❤️</span>
            <h1 id="titleDisplay">به سایت دزفولی ها خوش آمدید!</h1>
        </div>

        <div class="input-group" id="inputGroup">
            <label for="textInput" id="labelInput">📝 نام خود را وارد کنید:</label>
            <input type="text" id="textInput" placeholder="مثلاً: علی" maxlength="30">
        </div>

        <button class="btn-primary" id="submitBtn">✅ وارد کردن</button>

        <div class="nav-buttons">
            <button class="btn-nav btn-prev" id="prevBtn" disabled>⬅️ قبلی</button>
            <button class="btn-nav btn-next" id="nextBtn">بعدی ➡️</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-text" id="resultText">
                منتظر پاسخ شما هستم... 🌸
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');
        const labelInput = document.getElementById('labelInput');
        const titleDisplay = document.getElementById('titleDisplay');
        const emojiDisplay = document.getElementById('emojiDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dot1 = document.getElementById('dot1');
        const dot2 = document.getElementById('dot2');
        const dot3 = document.getElementById('dot3');

        let currentStep = 1;
        let savedName = '';
        let savedCity = '';
        let savedGrade = '';

        const steps = {
            1: {
                title: 'به سایت دزفولی ها خوش آمدید!',
                emoji: '❤️',
                label: '📝 نام خود را وارد کنید:',
                placeholder: 'مثلاً: علی',
                buttonText: '✅ وارد کردن',
                resultWaiting: 'منتظر نام تو هستم... 🌸',
                showResult: (value) => `مَمَل دوست داره <span class="name-highlight">"${value}"</span> رو ❤️`
            },
            2: {
                title: 'به سایت دزفولی ها خوش آمدید!',
                emoji: '🏙️',
                label: '🏙️ شهر خود را وارد کنید:',
                placeholder: 'مثلاً: دزفول',
                buttonText: '✅ بررسی شهر',
                resultWaiting: 'منتظر شهر شما هستم... 🌸',
                showResult: (value) => {
                    if (value === 'دزفول') {
                        return { text: 'آفرین به تو! 🎉', class: 'show-green' };
                    } else {
                        return { text: 'دزفول بهترین شهره! ❤️', class: 'show-red' };
                    }
                }
            },
            3: {
                title: 'به سایت دزفولی ها خوش آمدید!',
                emoji: '📚',
                label: '📊 معدل خود را وارد کنید (0 تا 20):',
                placeholder: 'مثلاً: 17.5',
                buttonText: '✅ بررسی معدل',
                resultWaiting: 'منتظر معدل شما هستم... 📊',
                showResult: (value) => {
                    const grade = parseFloat(value);
                    if (isNaN(grade) || grade < 0 || grade > 20) {
                        return { text: 'لطفاً یک عدد معتبر بین 0 تا 20 وارد کنید! ⚠️', class: 'show-red' };
                    }
                    if (grade >= 17) {
                        return { text: 'آفرین! پیش به سوی دارمشتات! 🚀🎉', class: 'show-green' };
                    } else {
                        return { text: 'بیشتر تلاش کن! ممل ازت راضی نیست! 😤💪', class: 'show-orange' };
                    }
                }
            }
        };

        function updateStep(step) {
            const data = steps[step];

            titleDisplay.textContent = data.title;
            emojiDisplay.textContent = data.emoji;
            labelInput.textContent = data.label;
            textInput.placeholder = data.placeholder;
            textInput.value = '';
            submitBtn.textContent = data.buttonText;
            resultContainer.className = 'result-container';
            resultText.className = 'result-text';
            resultText.textContent = data.resultWaiting;

            prevBtn.disabled = (step === 1);
            nextBtn.disabled = (step === 3);

            dot1.className = 'step-dot' + (step === 1 ? ' active' : '') + (step > 1 ? ' completed' : '');
            dot2.className = 'step-dot' + (step === 2 ? ' active' : '') + (step > 2 ? ' completed' : '');
            dot3.className = 'step-dot' + (step === 3 ? ' active' : '') + (step > 3 ? ' completed' : '');

            if (step === 1 && savedName) textInput.value = savedName;
            if (step === 2 && savedCity) textInput.value = savedCity;
            if (step === 3 && savedGrade) textInput.value = savedGrade;

            setTimeout(() => textInput.focus(), 80);
        }

        function showResult(value) {
            const data = steps[currentStep];
            const result = data.showResult(value);

            if (typeof result === 'string') {
                resultText.innerHTML = result;
                resultContainer.className = 'result-container show';
            } else {
                resultText.textContent = result.text;
                resultContainer.className = `result-container ${result.class}`;
            }

            resultText.className = 'result-text show';
        }

        function submitAnswer() {
            const value = textInput.value.trim();

            if (value === '') {
                const msg = currentStep === 1 ? 'نام خود را وارد کنید' :
                    currentStep === 2 ? 'شهر خود را وارد کنید' :
                    'معدل خود را وارد کنید';

                alert(`لطفاً ${msg}! 😊`);
                textInput.focus();
                return;
            }

            if (currentStep === 1) savedName = value;
            else if (currentStep === 2) savedCity = value;
            else savedGrade = value;

            showResult(value);
        }

        function goToNext() {
            if (currentStep === 1) {
                const name = textInput.value.trim();
                if (name !== '') savedName = name;
                currentStep = 2;
                updateStep(currentStep);
                if (savedCity) textInput.value = savedCity;
            } else if (currentStep === 2) {
                const city = textInput.value.trim();
                if (city !== '') savedCity = city;
                currentStep = 3;
                updateStep(currentStep);
                if (savedGrade) textInput.value = savedGrade;
            } else {
                alert('شما در آخرین سوال هستید! 🎉');
            }
        }

        function goToPrev() {
            if (currentStep === 2) {
                const city = textInput.value.trim();
                if (city !== '') savedCity = city;
                currentStep = 1;
                updateStep(currentStep);
                if (savedName) textInput.value = savedName;
            } else if (currentStep === 3) {
                const grade = textInput.value.trim();
                if (grade !== '') savedGrade = grade;
                currentStep = 2;
                updateStep(currentStep);
                if (savedCity) textInput.value = savedCity;
            } else {
                alert('شما در اولین سوال هستید! 😊');
            }
        }

        submitBtn.addEventListener('click', submitAnswer);
        textInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                submitAnswer();
            }
        });
        nextBtn.addEventListener('click', goToNext);
        prevBtn.addEventListener('click', goToPrev);

        textInput.addEventListener('input', function() {
            const data = steps[currentStep];
            resultContainer.className = 'result-container';
            resultText.className = 'result-text';
            resultText.textContent = data.resultWaiting;
        });

        updateStep(1);
    </script>
</body>
</html>
