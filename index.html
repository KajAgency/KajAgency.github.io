<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوپر موزیک پلیر فانتزی و پیشرفته گربول اولترا - نسخه کاملاً پایدار</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #fed7d7 50%, #feb2b2 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --border-glow: rgba(255, 107, 107, 0.3);
            --text-main: #2d3748;
            --text-sub: #718096;
            --primary: #ff6b6b;
            --primary-glow: rgba(255, 107, 107, 0.4);
            --secondary: #845ef7;
            --secondary-glow: rgba(132, 94, 247, 0.3);
            --accent: #ff8787;
            --glass-shadow: 0 25px 60px rgba(255, 107, 107, 0.25), inset 0 0 20px rgba(255,255,255,0.6);

            --active-item: linear-gradient(90deg, rgba(255, 107, 107, 0.15) 0%, rgba(132, 94, 247, 0.05) 100%);
        }

        .dark-cyber-cute {
            --bg-gradient: linear-gradient(135deg, #1a1b26 0%, #24283b 50%, #414868 100%);
            --card-bg: rgba(26, 27, 38, 0.85);
            --border-glow: rgba(187, 154, 247, 0.4);
            --text-main: #c0caf5;
            --text-sub: #9ece6a;
            --primary: #bb9af7;
            --primary-glow: rgba(187, 154, 247, 0.5);
            --secondary: #f7768e;
            --secondary-glow: rgba(247, 118, 142, 0.4);
            --accent: #7aa2f7;
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255,255,255,0.05);
            --active-item: linear-gradient(90deg, rgba(187, 154, 247, 0.2) 0%, rgba(247, 118, 142, 0.05) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .master-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            margin-top: 30px;
        }

        /* 3X Ultra Cute Animated Cat Ears Overlay */
        .cat-ears-ultra {
            position: absolute;
            top: -32px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            z-index: 1;
            pointer-events: none;
        }

        .ear-node {
            width: 75px;
            height: 75px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-glow);
            border-bottom: none;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
            transform: rotate(-10deg);
            position: relative;
            box-shadow: 0 -8px 20px rgba(255, 107, 107, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ear-node.right {
            transform: rotate(10deg);
        }

        .ear-node::after {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            width: 47px;
            height: 47px;
            background-color: var(--primary-glow);
            border-top-left-radius: 45px;
            border-top-right-radius: 45px;
            transition: background-color 0.3s;
        }

        .master-wrapper:hover .ear-node.left { transform: rotate(-14deg) translateY(-2px); }
        .master-wrapper:hover .ear-node.right { transform: rotate(14deg) translateY(-2px); }

        /* Premium Dashboard Container Grid */
        .dashboard-layout {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--border-glow);
            border-radius: 40px;
            box-shadow: var(--glass-shadow);
            padding: 35px;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 30px;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Top Header Control Layout */
        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--border-glow);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .identity-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .identity-logo {
            font-size: 1.8rem;
            animation: bounceMeow 3s infinite ease-in-out;
        }

        @keyframes bounceMeow {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.05); }
        }

        .main-brand-title {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.02);
        }

        .action-utilities {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Custom URL Injection Input Bar */
        .url-injection-form {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-glow);
            padding: 4px 6px;
            border-radius: 16px;
            gap: 8px;
            max-width: 320px;
            transition: all 0.3s ease;
        }
        .url-injection-form:focus-within {
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: var(--primary);
            background: rgba(255,255,255,0.9);
        }

        .url-input-field {
            background: none;
            border: none;
            outline: none;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: var(--text-main);
            width: 190px;
        }

        .btn-submit-url {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit-url:hover { transform: scale(1.03); }

        /* Local File Upload Custom Style */
        .local-upload-label {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .local-upload-label:hover {
            background: var(--secondary);
            color: white;
            box-shadow: 0 5px 15px var(--secondary-glow);
        }

        .speed-dropdown {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-main);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .btn-theme-switcher {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }
        .btn-theme-switcher:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 5px 15px var(--primary-glow);
        }

        /* RIGHT PANEL: Glowing Vinyl & Arm Turntable */
        .turntable-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid var(--border-glow);
            padding-right: 25px;
        }

        .vinyl-wrapper-node {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 20px 0;
        }

        .premium-vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #4a5568 0%, #1a202c 100%);
            padding: 46px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.3), 0 0 0 10px rgba(255, 107, 107, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateVinyl 8s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.4s;
        }

        .premium-vinyl.glowing-active {
            box-shadow: 0 20px 45px rgba(0,0,0,0.3), 0 0 25px var(--primary-glow);
        }

        .vinyl-artwork-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #1a202c;
        }

        .vinyl-arm-lever {
            position: absolute;
            top: -15px;
            left: 25px;
            width: 60px;
            height: 100px;
            transform-origin: top right;
            transform: rotate(-28deg);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 4;
        }
        .vinyl-arm-lever.active {
            transform: rotate(4deg);
        }

        @keyframes rotateVinyl {
            to { transform: rotate(360deg); }
        }

        /* Song Metadata Layout */
        .song-details-area {
            width: 100%;
            text-align: center;
            margin-bottom: 18px;
        }

        .title-txt {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-txt {
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* Custom Interactive Scrubbing Bar (Upgraded To Draggable Range Slider) */
        .timeline-scrub-box {
            width: 100%;
            margin-bottom: 18px;
        }

        .scrub-container {
            width: 100%;
            position: relative;
            margin-bottom: 8px;
        }

        .premium-scrub-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 20px;
            background: rgba(0,0,0,0.06);
            outline: none;
            cursor: pointer;
            display: block;
            border: 1px solid rgba(0,0,0,0.02);
        }

        /* Custom Drag Handle Paw style for Slider */
        .premium-scrub-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            cursor: grab;
            transition: transform 0.1s;
        }
        .premium-scrub-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.25);
        }

        .premium-scrub-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-main);
            border: 3px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            cursor: grab;
            transition: transform 0.1s;
        }
        .premium-scrub-slider::-moz-range-thumb:active {
            cursor: grabbing;
            transform: scale(1.25);
        }

        /* Deck Main Actions Buttons Layout */
        .deck-actions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            margin-bottom: 18px;
        }

        .btn-action-node {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-action-node:hover {
            color: var(--primary);
            transform: scale(1.2) translateY(-2px);
        }

        .btn-action-node.master-trigger {
            width: 62px;
            height: 62px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-radius: 50%;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn-action-node.master-trigger:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 30px var(--primary-glow);
        }
        .btn-action-node.active-loop-state {
            color: var(--secondary);
            filter: drop-shadow(0 0 5px var(--secondary-glow));
        }

        .volume-control-strip {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.03);
            padding: 10px 15px;
            border-radius: 18px;
        }

        .range-slider-element {
            width: 100%;
            accent-color: var(--primary);
            height: 5px;
            cursor: pointer;
        }

        /* LEFT PANEL: Equalizer, Lyrics & Dynamic Track List */
        .utilities-scroller-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 480px;
            overflow-y: auto;
            padding-left: 6px;
        }

        /* Equalizer Card Design */
        .kawaii-equalizer-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border-glow);
        }

        .eq-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .vertical-sliders-flex {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 95px;
        }

        .slider-column-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 100%;
        }

        .vertical-slider-bar {
            transform: rotate(-90deg);
            width: 60px;
            height: 6px;
            margin: 25px 0;
            accent-color: var(--secondary);
            cursor: pointer;
        }

        .slider-caption {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-sub);
        }

        /* Synchronized Rolling Script-Lyric Box */
        .lyrics-rolling-container {
            background: rgba(255, 107, 107, 0.03);
            border-radius: 24px;
            padding: 15px;
            height: 110px;
            overflow-y: auto;
            text-align: center;
            border: 1px solid var(--border-glow);
            position: relative;
            scroll-behavior: smooth;
        }

        .lyrics-track-line {
            font-size: 0.95rem;
            padding: 6px 0;
            color: var(--text-sub);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.5;
        }

        .lyrics-track-line.active-line-highlight {
            color: var(--primary);
            font-weight: 800;
            transform: scale(1.04);
            opacity: 1;
            text-shadow: 0 2px 8px var(--primary-glow);
        }

        /* High-Definition 32-Band Visualizer Graph Node Grid */
        .hd-visualizer-grid {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            width: 100%;
            padding: 0 10px;
        }
        .visualizer-node-bar {
            flex: 1;
            height: 4px;
            background: linear-gradient(to top, var(--primary), var(--secondary));
            border-radius: 4px 4px 0 0;
            transition: height 0.1s linear;
        }

        /* Advanced Track Playlist Manager Layout */
        .playlist-card-container {
            background: rgba(0,0,0,0.02);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid var(--border-glow);
        }

        .playlist-title-label {
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dynamic-tracks-ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .track-li-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }
        .track-li-row:hover {
            background: rgba(0,0,0,0.04);
            transform: translateX(-3px);
        }
        .track-li-row.active {
            background: var(--active-item);
            border-color: var(--border-glow);
            color: var(--primary);
            font-weight: bold;
        }
        
        .flex-meta-side {
            display: flex;
            align-items: center;
        }

        /* UI Message Prompt Box */
        .ui-status-bubble {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(45, 55, 72, 0.95);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .ui-status-bubble.visible { transform: translateX(-50%) translateY(0); }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .dashboard-layout { grid-template-columns: 1fr; padding: 25px; gap: 25px; }
            .turntable-panel { border-right: none; padding-right: 0; border-bottom: 2px dashed var(--border-glow); padding-bottom: 30px; }
            .utilities-scroller-panel { max-height: none; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .dashboard-layout { padding: 18px; border-radius: 30px; }
            .vinyl-wrapper-node { width: 180px; height: 180px; }
            .cat-ears-ultra { padding: 0 40px; top: -28px; }
            .ear-node { width: 55px; height: 55px; }
            .url-injection-form { max-width: 100%; width: 100%; }
            .url-input-field { width: 100%; }
            .header-panel { flex-direction: column; gap: 15px; align-items: flex-start; }
            .action-utilities { width: 100%; justify-content: space-between; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- HTML5 Audio Node for Isolated Core Streaming (Completely decoupled from script blocking loops) -->
    <audio id="real-audio-element"></audio>

    <div class="master-wrapper">
        <!-- Cat Ear Layers -->
        <div class="cat-ears-ultra">
            <div class="ear-node left"></div>
            <div class="ear-node right"></div>
        </div>

        <div class="dashboard-layout">
            <!-- TOP BAR CONTROL CONSOLE -->
            <div class="header-panel">
                
                    🐾</span>
                    <span class="main-brand-title">استودیو موزیکال فرانت‌اند گربول اولترا</span>
                </div>
                
                <div class="action-utilities">
                    <!-- URL Direct Input Inserter Layout -->
                    <div class="url-injection-form">
                        <input type="url" id="input-audio-url" class="url-input-field" placeholder="لینک مستقیم قطعه صوتی (MP3)..." dir="ltr">
                        <button class="btn-submit-url" id="btn-inject-link" title="بارگذاری قطعه سفارشی از وب">ثبت 🐾</button>
                    </div>

                    <!-- Local Audio File Custom Picker Container -->
                    <label class="local-upload-label" title="پخش فایل صوتی از روی کامپیوتر یا گوشی">
                        📁 انتخاب فایل لوکال
                        <input type="file" id="input-local-file" accept="audio/*" style="display: none;">
                    </label>

                    <!-- Speed Changer Selection Selector -->
                    <select id="playback-speed" class="speed-dropdown" title="سرعت گام پخش">
                        <option value="0.5">0.5x</option>
                        <option value="1.0" selected>1.0x (اصلی)</option>
                        <option value="1.5">1.5x</option>
                        <option value="2.0">2.0x</option>
                    </select>

                    <!-- Themes Swapper Button Toggle -->
                    <button class="btn-theme-switcher" id="theme-toggler" title="تغییر حالت نئون">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- LEFT VIEW PANEL: Equalizer, Lyrics scroller and tracks -->
            <div class="utilities-scroller-panel">
                
                <!-- Graphic 3-Band Parametric Equalizer Module Layout -->
                <div class="kawaii-equalizer-card">
                    <div class="eq-header-row">
                        <span>میکسر فرکانس صوتی استودیو گربول</span>
                        <select id="eq-preset" class="speed-dropdown">
                            <option value="flat">پریست هموار (Flat)</option>
                            <option value="bassboost">سوپر مِیو باس 🐾</option>
                            <option value="vocal">وضوح آواز کلام</option>
                            <option value="electronic">الکترونیک سایبرپانک</option>
                        </select>
                    </div>
                    <div class="vertical-sliders-flex">
                        <div class="slider-column-node">
                            <input type="range" class="vertical-slider-bar" id="eq-bass" min="-10" max="10" value="0">
                            <span class="slider-caption">BASS</span>
                        </div>
                        <div class="slider-column-node">
                            <input type="range" class="vertical-slider-bar" id="eq-mid" min="-10" max="10" value="0">
                            <span class="slider-caption">MID</span>
                        </div>
                        <div class="slider-column-node">
                            <input type="range" class="vertical-slider-bar" id="eq-treble" min="-10" max="10" value="0">
                            <span class="slider-caption">TREBLE</span>
                        </div>
                    </div>
                </div>

                <!-- Synchronized Lyrics Scrolling Module Box Layout -->
                <div class="lyrics-rolling-container" id="lyrics-viewport">
                    <div class="lyrics-track-line active-line-highlight">آماده بارگذاری موزیک یا لینک سفارشی... 🐾</div>
                </div>

                <!-- 32-Band Audio Frequency Spectrum Visualizer Layout -->
                <div class="hd-visualizer-grid" id="spectrum-bars-grid">
                    <!-- Nodes added programmatically -->
                </div>

                <!-- Track Playlist Manager Container -->
                <div class="playlist-card-container">
                    <div class="playlist-title-label">
                        <span>📂 کتابخانه قطعات فعال پروژه گربول شجاع</span>
                    </div>
                    <ul class="dynamic-tracks-ul" id="tracks-list-dom">
                        <!-- Items rendered via engine -->
                    </ul>
                </div>
            </div>

                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 21.9 5.42 21.9 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

    <!-- UI Message Box Prompt -->
    <div class="ui-status-bubble" id="status-toast-node">پیام فرانت‌اند گربول 🐾</div>

    <script>
        const coreTrackDatabase = [
            {
                title: "کدنویسی نیمه‌شب گربول شجاع",
                artist: "آلبوم مهندسی فرانت‌اند دانشگاه",
                duration: 35,
                cover: "https://images.unsplash.com/photo-1515002246390-7bf7e8f87b54?fm=jpg&q=60&w=3000&auto=format&fit=crop",
                baseFreq: 260,
                isLocalFile: false,
                isExternal: false,
                liked: false,
                lyrics: {
                    0: "🐾 نیمه شبه و گربول بیداره پای کد...",
                    8: "💻 باگ‌ها می‌ترسن وقتی اونا رو می‌کنه متد!",
                    16: "🚀 رنک بالای دانشگاه با اراده‌ای شجاع",
                    25: "✨ آینده مال گربوله، توی دنیای فرانت‌اند..."
                }
            },
            {
                title: "تصمیم بزرگ لوپ فرانت‌اند",
                artist: "گربول مَمل نسخه اولترا",
                duration: 40,
                cover: "https://images.unsplash.com/photo-1561948955-570b270e7c36?fm=jpg&q=60&w=3000&auto=format&fit=crop",
                baseFreq: 340,
                isLocalFile: false,
                isExternal: false,
                liked: false,
                lyrics: {
                    0: "🎵 تصمیم بزرگ گربول برای تغییر پوسته وب...",
                    10: "⚡ ری‌اکت و کامپوننت‌ها دارن رندر میشن امشب",
                    22: "🧠 هیچ کی نمی‌تونه جلوشو بگیره توی این لوپ",
                    32: "🌟 گربول پرو رو بشناس، گربه فرانت‌اند شجاع!"
                }
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;
        let currentTimeSec = 0;
        let isMutedState = false;
        let isShuffleState = false;
        let isLoopTrackState = false;
        let isUserDraggingSlider = false; // Flag to prevent update looping while scrubbing

        let audioContextInstance = null;
        let liveOscillatorNode = null;
        let activeBufferSourceNode = null; 
        let gainNodeController = null;
        let bassBiquadFilter = null;
        let midBiquadFilter = null;
        let trebleBiquadFilter = null;

        let clockTimerTicker = null;
        let spectrumVisualizerTicker = null;
        let currentDecodedAudioBuffer = null; 
        let isNativeStreamingActive = false; 

        let virtualTimeTrackerBase = 0;
        let virtualPlaybackAccumulator = 0;

        const vinylDiskNode = document.getElementById('vinyl-disk-node');
        const turntableArmLever = document.getElementById('turntable-arm-lever');
        const deckCoverArtwork = document.getElementById('deck-cover-artwork');
        const deckTrackTitle = document.getElementById('deck-track-title');
        const deckTrackArtist = document.getElementById('deck-track-artist');
        const premiumTimeSlider = document.getElementById('premium-time-slider');
        const labelTimeCurrent = document.getElementById('label-time-current');
        const labelTimeTotal = document.getElementById('label-time-total');

        const btnMasterTriggerPlay = document.getElementById('btn-master-trigger-play');
        const svgIcoPlay = document.getElementById('svg-ico-play');
        const svgIcoPause = document.getElementById('svg-ico-pause');
        const sliderVolumeNode = document.getElementById('slider-volume-node');

        const btnFavoriteHeart = document.getElementById('btn-favorite-heart');
        const btnShuffleToggle = document.getElementById('btn-shuffle-toggle');
        const btnLoopToggle = document.getElementById('btn-loop-toggle');
        const playbackSpeedDropdown = document.getElementById('playback-speed');
        const eqPresetDropdown = document.getElementById('eq-preset');
        const themeToggler = document.getElementById('theme-toggler');

        const lyricsViewport = document.getElementById('lyrics-viewport');
        const spectrumBarsGrid = document.getElementById('spectrum-bars-grid');
        const tracksListDom = document.getElementById('tracks-list-dom');
        const realAudioElement = document.getElementById('real-audio-element');
        const inputLocalFile = document.getElementById('input-local-file');

        function displayToastNotification(msg) {
            const bubble = document.getElementById('status-toast-node');
            bubble.textContent = msg;
            bubble.classList.add('visible');
            setTimeout(() => { bubble.classList.remove('visible'); }, 3000);
        }

        function buildSpectrumVisualizerLayoutNodes() {
            spectrumBarsGrid.innerHTML = '';
            for(let i=0; i<32; i++) {
                const node = document.createElement('div');
                node.className = 'visualizer-node-bar';
                spectrumBarsGrid.appendChild(node);
            }
        }

        function bootstrapStudioAudioNodes() {
            if (!audioContextInstance) {
                audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
                
                bassBiquadFilter = audioContextInstance.createBiquadFilter();
                bassBiquadFilter.type = 'lowshelf';
                bassBiquadFilter.frequency.setValueAtTime(220, audioContextInstance.currentTime);

                midBiquadFilter = audioContextInstance.createBiquadFilter();
                midBiquadFilter.type = 'peaking';
                midBiquadFilter.Q.setValueAtTime(1.0, audioContextInstance.currentTime);
                midBiquadFilter.frequency.setValueAtTime(1100, audioContextInstance.currentTime);

                trebleBiquadFilter = audioContextInstance.createBiquadFilter();
                trebleBiquadFilter.type = 'highshelf';
                trebleBiquadFilter.frequency.setValueAtTime(3200, audioContextInstance.currentTime);

                gainNodeController = audioContextInstance.createGain();
                synchronizeVolumeGainLevel();
            }

            if (audioContextInstance && audioContextInstance.state === 'suspended') {
                audioContextInstance.resume();
            }
        }

        function synchronizeVolumeGainLevel() {
            const targetVol = isMutedState ? 0 : (sliderVolumeNode.value / 100);
            if (gainNodeController && audioContextInstance) {
                const multiplier = liveOscillatorNode ? 0.20 : 1.0;
                gainNodeController.gain.setValueAtTime(targetVol * multiplier, audioContextInstance.currentTime);
            }
            // Master Hardware Audio-Routing Fix: Forcing stream targets to strictly consume direct output levels
            realAudioElement.volume = targetVol;
            realAudioElement.muted = isMutedState;
        }

        function transformSpeedAdjustmentRate() {
            const rate = parseFloat(playbackSpeedDropdown.value);
            if (isPlaying && currentDecodedAudioBuffer && activeBufferSourceNode) {
                activeBufferSourceNode.playbackRate.setValueAtTime(rate, audioContextInstance.currentTime);
            }
        }

        function executeOscillatorSynthPlay(freq) {
            bootstrapStudioAudioNodes();
            terminateOscillatorSynth();

            liveOscillatorNode = audioContextInstance.createOscillator();
            liveOscillatorNode.type = 'triangle';
            liveOscillatorNode.frequency.setValueAtTime(freq * parseFloat(playbackSpeedDropdown.value), audioContextInstance.currentTime);

            liveOscillatorNode.connect(bassBiquadFilter);
            bassBiquadFilter.connect(midBiquadFilter);
            midBiquadFilter.connect(trebleBiquadFilter);
            trebleBiquadFilter.connect(gainNodeController);
            gainNodeController.connect(audioContextInstance.destination);

            liveOscillatorNode.start();
            synchronizeVolumeGainLevel();
        }

        function terminateOscillatorSynth() {
            if (liveOscillatorNode) {
                try {
                    liveOscillatorNode.stop();
                    liveOscillatorNode.disconnect();
                } catch(err) {}
                liveOscillatorNode = null;
            }
        }

        function stopActiveBufferSource() {
            if (activeBufferSourceNode) {
                try { activeBufferSourceNode.stop(); activeBufferSourceNode.disconnect(); } catch(e) {}
                activeBufferSourceNode = null;
            }
        }

        function renderTimeStringLayout(sec) {
            if (isNaN(sec) || sec === Infinity || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function rebuildTracksLibraryViewUI() {
            tracksListDom.innerHTML = '';
            coreTrackDatabase.forEach((track, i) => {
                const li = document.createElement('li');
                li.className = `track-li-row ${i === currentTrackIndex ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="flex-meta-side">
                        <span style="opacity: 0.65;">🐾 0${i+1}</span>
                        <div style="margin-right: 8px;">${track.title}</div>
                    </div>
                    <div style="font-size: 0.75rem; opacity: 0.8;">${track.isExternal ? (track.isLocalFile ? 'فایل لوکال 📁' : 'منبع وب 🌐') : renderTimeStringLayout(track.duration)}</div>
                `;
                li.addEventListener('click', () => { triggerSelectTrackNode(i); });
                tracksListDom.appendChild(li);
            });
        }

        function triggerSelectTrackNode(index) {
            currentTrackIndex = index;
            currentTimeSec = 0;
            virtualPlaybackAccumulator = 0;
            const track = coreTrackDatabase[currentTrackIndex];

            terminateOscillatorSynth();
            stopActiveBufferSource();
            realAudioElement.pause();
            
            if (track.audioBuffer) {
                currentDecodedAudioBuffer = track.audioBuffer;
                isNativeStreamingActive = false;
                realAudioElement.removeAttribute('src');
            } else {
                currentDecodedAudioBuffer = null;
                if (track.url) {
                    isNativeStreamingActive = true;
                    realAudioElement.src = track.url;
                    realAudioElement.load();
                } else {
                    isNativeStreamingActive = false;
                    realAudioElement.removeAttribute('src');
                }
            }

            deckTrackTitle.textContent = track.title;
            deckTrackArtist.textContent = track.artist;
            deckCoverArtwork.src = track.cover;
            
            labelTimeCurrent.textContent = "00:00";
            labelTimeTotal.textContent = renderTimeStringLayout(track.duration);
            
            premiumTimeSlider.max = Math.floor(track.duration);
            premiumTimeSlider.value = 0;

            btnFavoriteHeart.style.color = track.liked ? 'var(--primary)' : 'var(--text-sub)';

            rebuildTracksLibraryViewUI();
            generateLyricsListDOM();

            if (isPlaying) {
                executeTrackPlaybackCore();
            }
        }

        function generateLyricsListDOM() {
            lyricsViewport.innerHTML = '';
            const track = coreTrackDatabase[currentTrackIndex];
            Object.keys(track.lyrics).forEach(timeKey => {
                const div = document.createElement('div');
                div.className = 'lyrics-track-line';
                div.id = `line-node-key-${timeKey}`;
                div.textContent = track.lyrics[timeKey];
                lyricsViewport.appendChild(div);
            });
            executeLyricsHighlightSync();
        }

        function executeLyricsHighlightSync() {
            const track = coreTrackDatabase[currentTrackIndex];
            let matchedKey = null;

            Object.keys(track.lyrics).forEach(timeKey => {
                if (currentTimeSec >= parseInt(timeKey)) {
                    matchedKey = timeKey;
                }
            });

            if (matchedKey !== null) {
                const items = lyricsViewport.querySelectorAll('.lyrics-track-line');
                items.forEach(item => item.classList.remove('active-line-highlight'));
                
                const targetLine = document.getElementById(`line-node-key-${matchedKey}`);
                if (targetLine) {
                    targetLine.classList.add('active-line-highlight');
                    lyricsViewport.scrollTop = targetLine.offsetTop - 35;
                }
            }
        }

        function handlePlayPauseMasterToggle() {
            bootstrapStudioAudioNodes();
            if (isPlaying) {
                isPlaying = false;
                svgIcoPlay.style.display = 'block';
                svgIcoPause.style.display = 'none';
                vinylDiskNode.style.animationPlayState = 'paused';
                vinylDiskNode.classList.remove('glowing-active');
                turntableArmLever.classList.remove('active');
                
                terminateOscillatorSynth();
                stopActiveBufferSource();
                realAudioElement.pause();
                
                virtualPlaybackAccumulator += (performance.now() - virtualTimeTrackerBase) / 1000;
                
                clearInterval(clockTimerTicker);
                clearInterval(spectrumVisualizerTicker);
                resetVisualizerGraphToFloor();
            } else {
                isPlaying = true;
                svgIcoPlay.style.display = 'none';
                svgIcoPause.style.display = 'block';
                vinylDiskNode.style.animationPlayState = 'running';
                vinylDiskNode.classList.add('glowing-active');
                turntableArmLever.classList.add('active');

                virtualTimeTrackerBase = performance.now();
                executeTrackPlaybackCore();
            }
        }

        function executeTrackPlaybackCore() {
            if (clockTimerTicker) clearInterval(clockTimerTicker);
            if (spectrumVisualizerTicker) clearInterval(spectrumVisualizerTicker);
            terminateOscillatorSynth();
            stopActiveBufferSource();

            const track = coreTrackDatabase[currentTrackIndex];
            const speedRate = parseFloat(playbackSpeedDropdown.value);

            synchronizeVolumeGainLevel();

            if (currentDecodedAudioBuffer) {
                activeBufferSourceNode = audioContextInstance.createBufferSource();
                activeBufferSourceNode.buffer = currentDecodedAudioBuffer;
                activeBufferSourceNode.playbackRate.setValueAtTime(speedRate, audioContextInstance.currentTime);
                
                activeBufferSourceNode.connect(bassBiquadFilter);
                bassBiquadFilter.connect(midBiquadFilter);
                midBiquadFilter.connect(trebleBiquadFilter);
                trebleBiquadFilter.connect(gainNodeController);
                gainNodeController.connect(audioContextInstance.destination);
                
                const startLocation = currentTimeSec <= track.duration ? currentTimeSec : 0;
                activeBufferSourceNode.start(0, startLocation);
                
                activeBufferSourceNode.onended = () => {
                    if (isPlaying && currentTimeSec >= track.duration - 0.5) {
                        handleTrackCycleFinished();
                    }
                };
            } else if (isNativeStreamingActive && track.url) {
                realAudioElement.playbackRate = speedRate;
                if(currentTimeSec > 0) {
                    try { realAudioElement.currentTime = currentTimeSec; } catch(e) {}
                }
                const playPromise = realAudioElement.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Audio elements triggered cleanly.");
                    });
                }
            } else {
                executeOscillatorSynthPlay(track.baseFreq || 300);
            }

            virtualTimeTrackerBase = performance.now();

            clockTimerTicker = setInterval(() => {
                if (isUserDraggingSlider) return; // Halt ticker synchronization while scrubbing manually

                const totalDuration = track.duration || 180;
                const deltaSession = (performance.now() - virtualTimeTrackerBase) / 1000;
                
                currentTimeSec = virtualPlaybackAccumulator + (deltaSession * speedRate);

                if (currentTimeSec >= totalDuration) {
                    currentTimeSec = totalDuration;
                    labelTimeCurrent.textContent = renderTimeStringLayout(currentTimeSec);
                    premiumTimeSlider.value = Math.floor(currentTimeSec);
                    clearInterval(clockTimerTicker);
                    handleTrackCycleFinished();
                    return;
                }

                labelTimeCurrent.textContent = renderTimeStringLayout(currentTimeSec);
                premiumTimeSlider.value = Math.floor(currentTimeSec);
                executeLyricsHighlightSync();
            }, 250);

            const nodes = document.querySelectorAll('.visualizer-node-bar');
            spectrumVisualizerTicker = setInterval(() => {
                nodes.forEach((node, idx) => {
                    let matrix = Math.sin(idx + currentTimeSec) * 10 + 16;
                    let heightVal = Math.floor(Math.random() * matrix) + 4;
                    node.style.height = `${Math.min(heightVal, 40)}px`;
                });
            }, 90);
        }

        function handleTrackCycleFinished() {
            currentTimeSec = 0;
            virtualPlaybackAccumulator = 0;
            virtualTimeTrackerBase = performance.now();
            premiumTimeSlider.value = 0;
            if (isLoopTrackState) {
                triggerSelectTrackNode(currentTrackIndex);
            } else if (isShuffleState) {
                let random = Math.floor(Math.random() * coreTrackDatabase.length);
                triggerSelectTrackNode(random);
            } else {
                let next = currentTrackIndex + 1;
                if (next >= coreTrackDatabase.length) next = 0;
                triggerSelectTrackNode(next);
            }
        }

        function resetVisualizerGraphToFloor() {
            document.querySelectorAll('.visualizer-node-bar').forEach(b => b.style.height = '4px');
        }

        function setupEqualizerListeners() {
            const bass = document.getElementById('eq-bass');
            const mid = document.getElementById('eq-mid');
            const treble = document.getElementById('eq-treble');

            bass.addEventListener('input', () => {
                if (bassBiquadFilter) bassBiquadFilter.gain.setValueAtTime(bass.value, audioContextInstance.currentTime);
            });
            mid.addEventListener('input', () => {
                if (midBiquadFilter) midBiquadFilter.gain.setValueAtTime(mid.value, audioContextInstance.currentTime);
            });
            treble.addEventListener('input', () => {
                if (trebleBiquadFilter) trebleBiquadFilter.gain.setValueAtTime(treble.value, audioContextInstance.currentTime);
            });
        }

        eqPresetDropdown.addEventListener('change', () => {
            const val = eqPresetDropdown.value;
            const b = document.getElementById('eq-bass');
            const m = document.getElementById('eq-mid');
            const t = document.getElementById('eq-treble');

            if(val === 'bassboost') { b.value = 9; m.value = 2; t.value = -3; }
            else if(val === 'vocal') { b.value = -4; m.value = 7; t.value = 3; }
            else if(val === 'electronic') { b.value = 7; m.value = -2; t.value = 8; }
            else { b.value = 0; m.value = 0; t.value = 0; }

            if (audioContextInstance) {
                bassBiquadFilter.gain.setValueAtTime(b.value, audioContextInstance.currentTime);
                midBiquadFilter.gain.setValueAtTime(m.value, audioContextInstance.currentTime);
                trebleBiquadFilter.gain.setValueAtTime(t.value, audioContextInstance.currentTime);
            }
        });

        function processRawBinaryDecodeSequence(arrayBuffer, fileNameString, targetArtistLabel, sourceUrlValue) {
            audioContextInstance.decodeAudioData(arrayBuffer, function(decodedBuffer) {
                const decodedTrackObject = {
                    title: fileNameString,
                    artist: targetArtistLabel,
                    duration: decodedBuffer.duration,
                    cover: sourceUrlValue ? "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?fm=jpg&q=60&w=3000&auto=format&fit=crop" : "https://images.unsplash.com/photo-1484755560693-a4074577af3a?fm=jpg&q=60&w=3000&auto=format&fit=crop",
                    baseFreq: 290,
                    isLocalFile: sourceUrlValue ? false : true,
                    isExternal: true,
                    liked: false,
                    audioBuffer: decodedBuffer,
                    url: sourceUrlValue || '',
                    lyrics: sourceUrlValue ? {
                        0: "🌐 بارگذاری و رمزگشایی باینری لینک وب با موفقیت انجام شد! 🐾",
                        12: "🎛️ فرکانس‌ها به صورت بافر مستقیم روی استودیو سوار شدند",
                        25: "✨ دکمه پخش صورتی را فشار دهید تا استودیو فانتزی شروع به کار کند!"
                    } : {
                        0: "📁 رمزگشایی چندفرمتی لوکال با موفقیت انجام شد! قفل کانال شکست 🐾",
                        8: "🎛️ جریانات فرکانسی مستقیماً روی لایه بافر رم سوار شدند",
                        20: "✨ دکمه صورتی Play را بزنید تا استودیو فانتزی گربول شروع به رقص کند!"
                    }
                };

                coreTrackDatabase.push(decodedTrackObject);
                displayToastNotification("قطعه صوتی با موفقیت لود و بافر شد! دکمه Play را فشار دهید 🐾");
                triggerSelectTrackNode(coreTrackDatabase.length - 1);
            }, function(decodeErr) {
                console.error("Binary execution matrix fault.");
            });
        }

        document.getElementById('btn-inject-link').addEventListener('click', () => {
            const urlValue = document.getElementById('input-audio-url').value.trim();
            if(!urlValue) {
                displayToastNotification("لطفاً ابتدا لینک مستقیم معتبر فایل صوتی را بنویسید! 🐾");
                return;
            }

            if (!urlValue.startsWith('http://') && !urlValue.startsWith('https://')) {
                displayToastNotification("لینک بارگذاری شده باید با http:// یا https:// شروع شود! 🐾");
                return;
            }

            lyricsViewport.innerHTML = `<div class="lyrics-track-line active-line-highlight" style="animation: bounceMeow 1s infinite;">⏳ استودیو گربول درحال اتصال و دریافت بی قفل سیگنال صوتی اینترنت...</div>`;
            displayToastNotification("⏳ درحال اتصال مستقیم به لایه توزیع لایو شبکه...");
            bootstrapStudioAudioNodes();

            if (isPlaying) {
                handlePlayPauseMasterToggle();
            }

            let filename = "قطعه سفارشی وب گربول";
            try {
                const parsed = new URL(urlValue);
                const pathParts = parsed.pathname.split('/');
                const lastPart = pathParts[pathParts.length - 1];
                if(lastPart && lastPart.includes('.mp3')) {
                    filename = decodeURIComponent(lastPart);
                }
            } catch(err) {}

            const secureProxyArray = [
                "https://allorigins.win",
                "https://corsproxy.io?"
            ];

            fetch(secureProxyArray[0] + encodeURIComponent(urlValue))
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    processRawBinaryDecodeSequence(arrayBuffer, filename, "استریم صوتی بافر مستقیم رم 🌐", urlValue);
                    document.getElementById('input-audio-url').value = '';
                })
                .catch(() => {
                    fetch(secureProxyArray[1] + encodeURIComponent(urlValue))
                        .then(res => { if(!res.ok) throw new Error(); return res.arrayBuffer(); })
                        .then(ab => {
                            processRawBinaryDecodeSequence(ab, filename, "استریم صوتی بافر مستقیم رم 🌐", urlValue);
                            document.getElementById('input-audio-url').value = '';
                        })
                        .catch(() => {
                            const onlineStreamTrackItem = {
                                title: filename,
                                artist: "استریم زنده بومی شبکه 🌐",
                                duration: 258, 
                                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?fm=jpg&q=60&w=3000&auto=format&fit=crop",
                                baseFreq: 310,
                                isLocalFile: false,
                                isExternal: true,
                                liked: false,
                                audioBuffer: null, 
                                url: urlValue,
                                lyrics: {
                                    0: "🌐 اتصال فرکانسی مستقیم بدون تداخل بافرینگ لایه امنیتی رم برقرار شد!",
                                    10: "⚡ انیمیشن‌های لایه رقص‌نور با فرکانس لایو شبکه همگام شدند",
                                    25: "🐾 موسیقی واقعی با خروجی صدای تضمین‌شده درحال اجراست!"
                                }
                            };
                            
                            coreTrackDatabase.push(onlineStreamTrackItem);
                            document.getElementById('input-audio-url').value = '';
                            displayToastNotification("آهنگ آنلاین متصل شد! دکمه صورتی Play را بزنید 🐾");
                            triggerSelectTrackNode(coreTrackDatabase.length - 1);
                        });
                });
        });

        inputLocalFile.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            lyricsViewport.innerHTML = `<div class="lyrics-track-line active-line-highlight" style="animation: bounceMeow 1s infinite;">⏳ استودیو گربول درحال خواندن باینری فرکانس‌های فایل محلی...</div>`;
            displayToastNotification("⏳ درحال رمزگشایی دیجیتال بافر صوتی فایل محلی شما...");
            bootstrapStudioAudioNodes();

            if (isPlaying) {
                handlePlayPauseMasterToggle();
            }

            let trackName = file.name;
            if (trackName.includes('.')) {
                trackName = trackName.substring(0, trackName.lastIndexOf('.'));
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                processRawBinaryDecodeSequence(arrayBuffer, trackName, `فرمت لوکال (${file.type.split('/')[1]?.toUpperCase() || 'صوتی'})`, null);
            };
            
            reader.readAsArrayBuffer(file);
        });

        // Event Listeners for the Premium Draggable Slider (Real-time Scrubbing Optimization)
        premiumTimeSlider.addEventListener('input', () => {
            isUserDraggingSlider = true;
            labelTimeCurrent.textContent = renderTimeStringLayout(parseInt(premiumTimeSlider.value));
        });

        premiumTimeSlider.addEventListener('change', () => {
            isUserDraggingSlider = false;
            currentTimeSec = parseInt(premiumTimeSlider.value);
            virtualPlaybackAccumulator = currentTimeSec;
            virtualTimeTrackerBase = performance.now();
            
            if (isNativeStreamingActive) {
                try { realAudioElement.currentTime = currentTimeSec; } catch(err) {}
            }
            
            if (isPlaying) {
                executeTrackPlaybackCore();
            } else {
                executeLyricsHighlightSync();
            }
        });

        btnMasterTriggerPlay.addEventListener('click', handlePlayPauseMasterToggle);
        document.getElementById('btn-next-node').addEventListener('click', () => {
            let next = currentTrackIndex + 1; if(next >= coreTrackDatabase.length) next = 0; triggerSelectTrackNode(next);
        });
        document.getElementById('btn-prev-node').addEventListener('click', () => {
            let prev = currentTrackIndex - 1; if(prev < 0) prev = coreTrackDatabase.length - 1; triggerSelectTrackNode(prev);
        });

        btnShuffleToggle.addEventListener('click', () => {
            isShuffleState = !isShuffleState;
            btnShuffleToggle.classList.toggle('active-loop-state', isShuffleState);
            displayToastNotification(isShuffleState ? "حالت پخش تصادفی فعال شد 🐾" : "پخش تصادفی غیرفعال شد");
        });
        btnLoopToggle.addEventListener('click', () => {
            isLoopTrackState = !isLoopTrackState;
            btnLoopToggle.classList.toggle('active-loop-state', isLoopTrackState);
            displayToastNotification(isLoopTrackState ? "تکرار قطعه فعال شد 🔁" : "تکرار قطعه غیرفعال شد");
        });

        btnFavoriteHeart.addEventListener('click', () => {
            const track = coreTrackDatabase[currentTrackIndex];
            track.liked = !track.liked;
            btnFavoriteHeart.style.color = track.liked ? 'var(--primary)' : 'var(--text-sub)';
        });

        sliderVolumeNode.addEventListener('input', synchronizeVolumeGainLevel);
        document.getElementById('btn-mute-switch').addEventListener('click', () => {
            isMutedState = !isMutedState;
            document.getElementById('btn-mute-switch').style.color = isMutedState ? 'var(--primary)' : 'var(--text-sub)';
            synchronizeVolumeGainLevel();
        });

        playbackSpeedDropdown.addEventListener('change', () => {
            transformSpeedAdjustmentRate();
            if (isPlaying) {
                virtualPlaybackAccumulator = currentTimeSec;
                virtualTimeTrackerBase = performance.now();
                executeTrackPlaybackCore();
            }
        });

        themeToggler.addEventListener('click', () => {
            document.body.classList.toggle('dark-cyber-cute');
        });

        buildSpectrumVisualizerLayoutNodes();
        triggerSelectTrackNode(0);
        setupEqualizerListeners();
    </script>
</body>
</html>
